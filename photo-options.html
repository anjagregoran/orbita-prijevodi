<style>
body { margin: 0; padding: 32px 20px 60px; background: #faf8f4; color: #1c1f24; font-family: "DM Sans", sans-serif; }
h1 { font-family: "Fraunces", serif; font-weight: 300; font-size: clamp(32px, 4vw, 52px); margin: 0 0 6px; }
.intro { color: #626973; margin: 0 0 28px; max-width: 60ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 26px; }
figure { margin: 0; }
.ph { position: relative; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; background: #222; }
.img { position: absolute; inset: 0; background-size: cover; }
.ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,15,19,.72), rgba(14,15,19,.25) 70%); }
.txt { position: absolute; z-index: 1; left: 7%; top: 50%; transform: translateY(-50%); color: #fbf5ec; max-width: 70%; }
.txt p { font: 400 clamp(9px, 1vw, 11px) "DM Mono", monospace; letter-spacing: .18em; text-transform: uppercase; color: #a9d3ef; margin: 0 0 8px; }
.txt h2 { font-family: "Fraunces", serif; font-weight: 300; font-size: clamp(24px, 3vw, 40px); line-height: 1.05; margin: 0; }
.txt em { color: #d65a3d; }
figcaption { display: flex; gap: 12px; align-items: baseline; padding: 12px 6px 0; font-size: 15px; }
figcaption b { font-family: "Fraunces", serif; font-weight: 300; font-size: 22px; color: #d65a3d; }
</style></head><body>
